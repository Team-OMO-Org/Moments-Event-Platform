<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zxx" class="no-js">
<head>
    <!-- Include meta tags -->
    <th:block th:replace="~{fragments/head :: meta}"/>

    <!-- Page title -->
    <title>Cart</title>

    <!-- Include common CSS -->
    <th:block th:replace="~{fragments/head :: common-css}"/>
</head>

<body>

<!-- Include header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Banner -->
<div th:replace="~{fragments/banner :: banner('Moments Event Platform', 'Feel The Moment')}"></div>


<!--================Cart Area =================-->
<section class="cart_area">
    <div class="container">
        <div class="cart_inner">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th scope="col">Moment</th>
                        <th scope="col">Price</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cartItem : ${cartView.items}">
                        <td>
                            <div class="media">
                                <div class="d-flex">
                                    <a th:href="@{'/moment/' + ${cartItem.momentId}}">
                                    <img th:src="${cartItem.thumbnail}" alt="" style="max-width: 150px;">
                                    </a>
                                </div>
                                <div class="media-body">
                                    <p th:text="${cartItem.title}"></p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <h5 th:text="${'€' + cartItem.price}"></h5>
                        </td>
                        <td>
                            <div class="product_count">
                                <input type="text" name="qty" id="sst" maxlength="12"
                                       th:value="${cartItem.quantity}" title="Quantity:"
                                       class="input-text qty">
                                <button
                                    onclick="var result = document.getElementById('sst'); var sst = result.value; if( !isNaN( sst )){result.value++;
}return false;"
                                    class="increase items-count" type="button"><i
                                    class="lnr lnr-chevron-up"></i>
                                </button>
                                <button
                                    onclick="var result = document.getElementById('sst'); var sst = result.value; if( !isNaN( sst ) &amp;&amp; sst > 0 ){result.value--;
}return false;"
                                    class="reduced items-count" type="button"><i
                                    class="lnr lnr-chevron-down"></i>
                                </button>
                            </div>
                        </td>
                        <td>
                            <h5 th:text="${'€' + cartItem.totalPrice}"></h5>
                        </td>
                    </tr>
                    <!-- Buttons Area -->

                    <tr class="bottom_button">
                        <td colspan="4">
                            <div style="display: flex; justify-content: space-between;">
                                <a class="gray_btn" href="#">Clear Cart</a>
                                <a class="gray_btn" href="#">Update Cart</a>
                            </div>
                        </td>

                        </td>-->

                        <td>

                        </td>
                        <td>

                        </td>
                        <td>

                        </td>
                        <td>
                            <h5 th:text="${'€' + cartView.subtotal}"></h5>
                        </td>
                    </tr>
